version: '3'

networks:
  app-net:
    external: true

services:
  llmops-ui:
    image: llmops-ui:0.1.0
    build:
      context: ../ui
      dockerfile: Dockerfile
    container_name: llmops-ui
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    environment: [ ]
    ports:
      - "3000:3000"
    networks:
      - app-net

  llmops-api:
    image: llmops-api:0.1.0
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: llmops-api
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    volumes:
      - /data/llmops/storage:/app/api/storage
    env_file:
      - /data/llmops/env/.env
    environment:
      # 模式为API，代表启用API服务
      MODE: api
      SERVER_WORKER_AMOUNT: 4
      SERVER_THREAD_AMOUNT: 4
      # 数据库迁移配置
      MIGRATION_ENABLED: ${MIGRATION_ENABLED:-true}
      # JWT加密秘钥
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      # CSRF校验开关
      WTF_CSRF_ENABLED: ${WTF_CSRF_ENABLED:-false}
      # SQLAlchemy数据库配置
      SQLALCHEMY_DATABASE_URI: ${SQLALCHEMY_DATABASE_URI}
      SQLALCHEMY_POOL_SIZE: ${SQLALCHEMY_POOL_SIZE:-30}
      SQLALCHEMY_POOL_RECYCLE: ${SQLALCHEMY_RECYCLE:-3600}
      SQLALCHEMY_ECHO: ${SQLALCHEMY_ECHO:-false}
      # Redis缓存数据库配置
      REDIS_HOST: ${REDIS_HOST:-llmops-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_USE_SSL: ${REDIS_USE_SSL:-false}
      # Weaviate向量数据库配置
      WEAVIATE_HTTP_HOST: ${WEAVIATE_HTTP_HOST:-llmops-weaviate}
      WEAVIATE_HTTP_PORT: ${WEAVIATE_HTTP_PORT:-8080}
      WEAVIATE_GRPC_HOST: ${WEAVIATE_GRPC_HOST:-llmops-weaviate}
      WEAVIATE_GRPC_PORT: ${WEAVIATE_GRPC_PORT:-50051}
      WEAVIATE_API_KEY: ${WEAVIATE_API_KEY}
      # 腾讯云COS对象存储
      COS_SECRET_ID: ${COS_SECRET_ID}
      COS_SECRET_KEY: ${COS_SECRET_KEY}
      COS_REGION: ${COS_REGION}
      COS_SCHEME: ${COS_SCHEMA:-https}
      COS_BUCKET: ${COS_BUCKET}
      COS_DOMAIN: ${COS_DOMAIN:-}
      # Celery异步队列任务配置
      CELERY_BROKER_DB: ${CELERY_BROKER_DB:-1}
      CELERY_RESULT_BACKEND_DB: ${CELERY_RESULT_BACKEND_DB:-1}
      CELERY_TASK_IGNORE_RESULT: ${CELERY_TASK_IGNORE_RESULT:-true}
      CELERY_RESULT_EXPIRES: ${CELERY_RESULT_EXPIRES:-3600}
      CELERY_BROKER_CONNECTION_RETRY_ON_STARTUP: ${CELERY_BROKER_CONNECTION_RETRY_ON_STARTUP:-true}
      # Github OAuth应用秘钥
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI}
      # LangSmith配置
      LANGCHAIN_TRACING_V2: false
      # HuggingFace配置
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
      # 辅助Agent智能体应用id标识
      ASSISTANT_AGENT_ID: ${ASSISTANT_AGENT_ID}
      # OpenAI服务提供者
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_API_BASE: ${OPENAI_API_BASE}
      # 小米MiMo服务提供者
      MIMO_API_KEY: ${MIMO_API_KEY}
      MIMO_API_BASE: ${MIMO_API_BASE}
      # DeepSeek服务提供者
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_API_BASE: ${DEEPSEEK_API_BASE}
      # 百度千帆服务提供者
      qianfan_ak: ${QIANFAN_AK}
      qianfan_sk: ${QIANFAN_SK}
      # 月之暗面服务提供者
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY}
      # 通义千问服务提供者
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      # 高德工具API秘钥
      GAODE_API_KEY: ${GAODE_API_KEY}
      # 谷歌Serper搜索API秘钥
      SERPER_API_KEY: ${SERPER_API_KEY}
      # HuggingFace配置
      HUGGINGFACEHUB_API_TOKEN: ${HUGGINGFACEHUB_API_TOKEN}
      # 邮箱白名单
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
    ports:
      - "5001:5001"
    depends_on:
      - llmops-db
      - llmops-redis
      - llmops-weaviate
    networks:
      - app-net

  llmops-celery:
    image: llmops-api:0.1.0
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: llmops-celery
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    volumes:
      - /data/llmops/storage:/app/api/storage
    env_file:
      - /data/llmops/env/.env
    environment:
      # 模式为celery，代表启用Celery异步任务队列
      MODE: celery
      CELERY_WORKER_AMOUNT: 4
      # 数据库迁移配置
      MIGRATION_ENABLED: 'false'
      # JWT加密秘钥
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      # CSRF校验开关
      WTF_CSRF_ENABLED: ${WTF_CSRF_ENABLED:-false}
      # SQLAlchemy数据库配置
      SQLALCHEMY_DATABASE_URI: ${SQLALCHEMY_DATABASE_URI}
      SQLALCHEMY_POOL_SIZE: ${SQLALCHEMY_POOL_SIZE:-30}
      SQLALCHEMY_POOL_RECYCLE: ${SQLALCHEMY_RECYCLE:-3600}
      SQLALCHEMY_ECHO: ${SQLALCHEMY_ECHO:-false}
      # Redis缓存数据库配置
      REDIS_HOST: ${REDIS_HOST:-llmops-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_USE_SSL: ${REDIS_USE_SSL:-false}
      # Weaviate向量数据库配置
      WEAVIATE_HTTP_HOST: ${WEAVIATE_HTTP_HOST:-llmops-weaviate}
      WEAVIATE_HTTP_PORT: ${WEAVIATE_HTTP_PORT:-8080}
      WEAVIATE_GRPC_HOST: ${WEAVIATE_GRPC_HOST:-llmops-weaviate}
      WEAVIATE_GRPC_PORT: ${WEAVIATE_GRPC_PORT:-50051}
      WEAVIATE_API_KEY: ${WEAVIATE_API_KEY}
      # 腾讯云COS对象存储
      COS_SECRET_ID: ${COS_SECRET_ID}
      COS_SECRET_KEY: ${COS_SECRET_KEY}
      COS_REGION: ${COS_REGION}
      COS_SCHEME: ${COS_SCHEMA:-https}
      COS_BUCKET: ${COS_BUCKET}
      COS_DOMAIN: ${COS_DOMAIN:-}
      # Celery异步队列任务配置
      CELERY_BROKER_DB: ${CELERY_BROKER_DB:-1}
      CELERY_RESULT_BACKEND_DB: ${CELERY_RESULT_BACKEND_DB:-1}
      CELERY_TASK_IGNORE_RESULT: ${CELERY_TASK_IGNORE_RESULT:-true}
      CELERY_RESULT_EXPIRES: ${CELERY_RESULT_EXPIRES:-3600}
      CELERY_BROKER_CONNECTION_RETRY_ON_STARTUP: ${CELERY_BROKER_CONNECTION_RETRY_ON_STARTUP:-true}
      # Github OAuth应用秘钥
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI}
      # LangSmith配置
      LANGCHAIN_TRACING_V2: false
      # HuggingFace配置
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
      # 辅助Agent智能体应用id标识
      ASSISTANT_AGENT_ID: ${ASSISTANT_AGENT_ID}
      # OpenAI服务提供者
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_API_BASE: ${OPENAI_API_BASE}
      # 小米MiMo服务提供者
      MIMO_API_KEY: ${MIMO_API_KEY}
      MIMO_API_BASE: ${MIMO_API_BASE}
      # DeepSeek服务提供者
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_API_BASE: ${DEEPSEEK_API_BASE}
      # 百度千帆服务提供者
      qianfan_ak: ${QIANFAN_AK}
      qianfan_sk: ${QIANFAN_SK}
      # 月之暗面服务提供者
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY}
      # 通义千问服务提供者
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      # 高德工具API秘钥
      GAODE_API_KEY: ${GAODE_API_KEY}
      # 谷歌Serper搜索API秘钥
      SERPER_API_KEY: ${SERPER_API_KEY}
      # HuggingFace配置
      HUGGINGFACEHUB_API_TOKEN: ${HUGGINGFACEHUB_API_TOKEN}
      # 邮箱白名单
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
    depends_on:
      - llmops-db
      - llmops-redis
      - llmops-weaviate
    networks:
      - app-net

  llmops-redis:
    image: redis:6-alpine
    restart: always
    container_name: llmops-redis
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    volumes:
      - /data/llmops/redis:/data
    # 启动redis服务时配置
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
    ports:
      - "6379:6379"
    networks:
      - app-net

  llmops-db:
    image: postgres:15-alpine
    restart: always
    container_name: llmops-db
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      # 配置默认的账户名、账户密码、默认数据库、数据存储的位置
      PGUSER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: llmops
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # 将postgres数据挂载到本地./volumes/db/data上
      - /data/llmops/postgres:/var/lib/postgresql/data/pgdata
      # 初始化脚本只有在空数据挂载的情况下才会触发执行(.sql/.sh等)，如果已经存在数据则不会执行
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      # 每隔1s发起一个健康测试，最多重试30次
      test: [ "CMD", "pg_isready" ]
      interval: 1s
      timeout: 3s
      retries: 30
    ports:
      - "5432:5432"
    networks:
      - app-net

  llmops-weaviate:
    image: semitechnologies/weaviate:1.28.4
    container_name: llmops-weaviate
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      QUERY_DEFAULTS_LIMIT: 25  # 查询默认返回的数据条数
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'false'  # 需要授权才能和weaviate进行交互
      PERSISTENCE_DATA_PATH: /var/lib/weaviate  # weaviate数据存储路径
      DEFAULT_VECTORIZER_MODULE: 'none'  # 向量化模块设置为none
      CLUSTER_HOSTNAME: 'node1'  # 节点的主机名字
      AUTHENTICATION_APIKEY_ENABLED: 'true'  # 启动基于API秘钥的身份校验
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${WEAVIATE_API_KEY}  # 允许的API秘钥列表
      AUTHENTICATION_APIKEY_USERS: ${WEAVIATE_API_USER}  # 基于秘钥的API身份列表
      AUTHORIZATION_ADMINLIST_ENABLED: 'true'  # 启动AdminList授权方案
      AUTHORIZATION_ADMINLIST_USERS: ${WEAVIATE_API_USER}  # 使用AdminList方案时具有管理权限的用户
    volumes:
      - /data/llmops/weaviate:/var/lib/weaviate
    ports:
      - "8080:8080"
      - "50051:50051"
    networks:
      - app-net