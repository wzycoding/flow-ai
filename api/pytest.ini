[pytest]
# 设置测试缓存文件存储在 tmp/.pytest_cache 中
cache_dir = tmp/.pytest_cache

# 设置默认的命令行选项
addopts = -v -s

testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    external: tests that call real external services
    slow: tests that may take longer than a local unit test
    docker: tests intended for a docker-compose runtime
